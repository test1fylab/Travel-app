<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#4a3426">
<title>旅行安排</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f3ead8;--card:#f3ead8;--card2:#fbf6ea;--tx:#3a2a1e;--mu:#8c7b69;--ac:#b8892f;--ink:#4a3426;--on:#f3ead8;--bd:#e0d2b8;--hl:#f0d98c;--warn:#a3472a;color-scheme:light;
--serif:"Cormorant Garamond","Noto Serif TC","Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
--sans:"Jost","Noto Sans TC","Hiragino Sans","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:#f3ead8}
body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--tx);font:15px/1.75 var(--sans);letter-spacing:.03em;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
button,input,select,textarea{font-feature-settings:'lnum' 1}
main{max-width:520px;margin:0 auto;padding:18px 20px calc(120px + env(safe-area-inset-bottom,0px))}
a{color:var(--ac);text-underline-offset:3px}
input,select,textarea{width:100%;padding:10px 2px;margin:0 0 8px;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:transparent;color:var(--tx);font:inherit;font-size:16px;letter-spacing:.03em;outline:none}
input:focus,select:focus,textarea:focus{border-bottom-color:var(--tx)}
input[type=checkbox]{width:18px;height:18px;padding:0;margin:0;accent-color:var(--ink)}
input[readonly]{color:var(--mu)}
textarea{resize:none;line-height:1.7}
.row{display:flex;gap:10px;align-items:flex-end}.row>*{flex:1}
.card{background:none;border:0;border-top:1px solid var(--bd);border-radius:0;padding:16px 0;margin:0}
button{font-family:inherit;letter-spacing:.06em}
button.p{width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--ink);border-radius:2px;background:var(--ink);color:var(--on);font-size:15px;cursor:pointer}
button.p.g{background:transparent;color:var(--tx);border-color:var(--bd)}
button.p.r{background:transparent;color:var(--ac);border-color:var(--ac)}
button.p.s{width:auto;min-height:36px;padding:4px 14px;margin:0;font-size:13px}
button.x{border:0;background:none;color:var(--mu);cursor:pointer;font-size:15px;min-width:40px;min-height:40px;padding:0}
.mu{color:var(--mu);font-size:13px}
h3{margin:26px 0 4px;font-family:var(--serif);font-weight:500;font-size:17px;letter-spacing:.12em;padding-left:10px;border-left:3px solid var(--ac)}
.brand{font-family:var(--serif);font-size:15px;letter-spacing:.3em;color:var(--mu)}
.hd{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.hd .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tname{font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:.08em;border:0;margin:0;padding:6px 0}
.it{display:flex;gap:6px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--bd)}.it:last-child{border-bottom:0}
.it>div{flex:1;min-width:0}.it b{font-weight:400;color:var(--mu);margin-right:.7em;font-variant-numeric:tabular-nums}
.it.sel{background:linear-gradient(90deg,rgba(183,71,42,.10),transparent);margin:0 -8px;padding-left:8px;padding-right:8px}
.it .mu a{color:var(--mu)}
.chip{display:inline-block;padding:3px 14px;margin:0 6px 8px 0;border:1px solid var(--bd);border-radius:2px;font-size:13px;color:var(--tx)}
.chip.b{cursor:pointer}.chip.on{background:var(--ink);color:var(--on);border-color:var(--ink)}
.chk{display:inline-flex;gap:6px;align-items:center;margin-right:14px;min-height:32px}
details{margin-top:12px}summary{cursor:pointer;color:var(--mu);font-size:13px;letter-spacing:.1em;min-height:32px}
#map{height:240px;border:1px solid var(--bd);border-radius:2px;margin:6px 0 12px;z-index:0}
.leaflet-tile-pane{filter:grayscale(.55) sepia(.3) brightness(1.06) contrast(.9) saturate(.9)}
.pin{width:22px;height:22px;border-radius:50%;color:#fff;font:600 11px var(--sans);display:flex;align-items:center;justify-content:center;border:1.5px solid #f6f3ec;box-shadow:0 1px 3px rgba(0,0,0,.35)}
#dayf{margin-bottom:2px}
.banner{border-left:3px solid var(--ac);padding:4px 12px;margin:8px 0 14px;font-size:13px;color:var(--mu)}
.res{border-top:1px solid var(--bd);margin-bottom:8px}.res div{padding:10px 2px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on);padding:10px 18px;border-radius:2px;display:none;z-index:9999;font-size:13px;max-width:88vw;text-align:center}
/* 底部導覽 */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav button{flex:1;min-height:60px;border:0;background:none;color:var(--mu);font-size:11px;letter-spacing:.1em;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button svg{width:22px;height:22px;display:block}
nav button.on{color:var(--ink)}nav button.on svg{stroke:var(--ac)}

/* 新增按鈕與底部面板 */
#fab{position:fixed;right:20px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:var(--on);font-size:26px;line-height:1;display:none;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:21;cursor:pointer}
#veil{position:fixed;inset:0;background:rgba(20,18,15,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#veil.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:6px 22px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease;z-index:31;max-width:520px;margin:0 auto}
#sheet.open{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--bd);margin:8px auto 10px;cursor:pointer}
#sheet .card{border-top:0;padding-top:4px}

/* ---- 封面地圖行程頁 ---- */
main{padding-top:0}
#hero{position:relative;height:290px;margin:0 -20px;background:#4a3426;overflow:hidden}
#hero.mini{height:150px}#hero.mini #map{visibility:hidden}
#hero #map{position:absolute;inset:0;height:auto;border:0;margin:0;border-radius:0}
.hshade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(58,38,26,.30) 0%,rgba(58,38,26,0) 28%,rgba(58,38,26,.18) 45%,rgba(58,38,26,.92) 100%);z-index:2}
#hero.mini .hshade{background:linear-gradient(135deg,#4a3426,#6b4a32)}
.htop{position:absolute;left:14px;right:14px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;z-index:5}
.hb{width:38px;height:38px;border-radius:50%;background:rgba(243,234,216,.92);color:#4a3426;display:flex;align-items:center;justify-content:center;font-size:22px;text-decoration:none;line-height:1}
.hr button{border:0;border-radius:99px;background:rgba(243,234,216,.92);color:#4a3426;font-size:12px;padding:8px 14px;min-height:36px;cursor:pointer}
.htitle{position:absolute;left:20px;right:20px;bottom:30px;color:#fff;z-index:4;pointer-events:none}
.htitle input{pointer-events:auto}
.hreg{font-size:11px;letter-spacing:.3em;opacity:.85;min-height:16px}
#tname{color:#fff;font-size:28px;font-family:var(--serif);font-weight:600;letter-spacing:.06em;width:100%;padding:2px 0;border:0;margin:0;line-height:1.3}
#tname::placeholder{color:rgba(255,255,255,.6)}
.hmeta{font-size:13px;opacity:.9;letter-spacing:.08em;min-height:20px}
.ttl{display:flex;align-items:center;gap:6px;pointer-events:none}.ttl #tname{flex:1;min-width:0}
.shb{pointer-events:auto;flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.shb svg{width:18px;height:18px}
.nveil{}#nveil{position:fixed;inset:0;background:rgba(58,42,30,.45);z-index:50}
#nbox{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,420px);max-height:86vh;overflow-y:auto;background:var(--bg);padding:20px;z-index:51;border-radius:6px}
.cr{border:1px solid var(--bd);background:var(--card2);padding:16px;margin:12px 0}
.cr label{display:block;font-size:12px;color:var(--mu);letter-spacing:.1em}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:16px;z-index:4;pointer-events:none;border-top:2px solid var(--ac);background-color:var(--bg);background-image:linear-gradient(90deg,rgba(184,137,47,.5) 50%,transparent 50%),linear-gradient(rgba(184,137,47,.5) 50%,transparent 50%);background-size:12px 12px}
.leaflet-top.leaflet-right{top:56px}
.leaflet-tile-pane{filter:grayscale(.55) sepia(.3) brightness(1.06) contrast(.9) saturate(.9)}
.pw{position:relative;width:28px;height:36px}
.pn{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.pn span{transform:rotate(45deg);color:#fff;font:700 12px var(--sans)}
#dayf{position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;display:flex;overflow-x:auto;margin:0 -20px;padding:14px 20px 14px;scrollbar-width:none}#dayf::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;width:56px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap;text-align:center;padding:0;margin-right:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);cursor:pointer;line-height:1.25;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pill b{display:block;font-weight:600;font-size:15px}.pill span{display:block;font-size:10px;color:var(--mu)}.pill.drag{box-shadow:0 10px 22px rgba(58,38,26,.38);position:relative;z-index:3;border-color:var(--ac);transition:none}.pill.add{border-style:dashed}.pill.add b{color:var(--ac);font-size:15px}
.pill.on{background:var(--ink);color:var(--on);border-color:var(--ink)}.pill.on span{color:var(--on);opacity:.75}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;margin-top:14px}
.dnum{font-family:var(--serif);font-weight:700;font-size:64px;line-height:1;color:var(--ink)}.dnum span{font-size:22px;color:var(--ac);font-weight:600;margin-left:6px}
.dttl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 10px}
.dt{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.06em}
.today{display:inline-block;margin:0 0 14px;font-size:13px;font-weight:600;background:linear-gradient(transparent 55%,var(--hl) 55%);cursor:pointer;color:var(--tx)}
.navbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:16px;background:linear-gradient(90deg,#8a5a2b,#b8892f);color:#fff;text-decoration:none;font-weight:600;letter-spacing:.08em;box-shadow:0 6px 16px rgba(138,90,43,.25);margin-bottom:20px}
.navbtn.off{background:var(--bd);color:var(--mu);box-shadow:none;font-weight:400;font-size:13px}
.tl{padding-top:4px}
.tli{position:relative;display:grid;grid-template-columns:50px 14px 1fr;column-gap:10px;padding-bottom:16px}
.tli::before{content:"";position:absolute;left:calc(50px + 10px + 6px);top:0;bottom:0;width:2px;background:var(--ink);opacity:.85}
.tli:first-child::before{top:14px}.tli:last-child::before{bottom:calc(100% - 14px)}
.tlt{font-size:13px;color:var(--mu);text-align:right;padding-top:5px;font-variant-numeric:tabular-nums}
.tld{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);background:var(--bg);margin-top:7px;z-index:1}
.tlc{background:var(--card2);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;box-shadow:0 2px 10px rgba(58,38,26,.06);min-width:0;position:relative}
.tli.sel .tlc{border-color:var(--ac);box-shadow:0 0 0 2px rgba(184,137,47,.25)}
.tag{display:inline-block;padding:0 10px;border-radius:99px;font-size:12px;margin-right:6px;line-height:22px}
.tct{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.04em;margin:6px 0 2px;word-break:break-word}
.tcs{font-size:13px;color:var(--mu)}.tcs a{color:var(--mu)}
.tca{position:absolute;right:4px;top:4px}.tca button{min-width:34px;min-height:34px}

/* ---- 編輯行程頁 ---- */
body.editing #hero,body.editing #dayf,body.editing #hd,body.editing nav,body.editing #fab{display:none!important}
body.editing main{padding-top:calc(20px + env(safe-area-inset-top,0px))}
.eh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.et{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink);letter-spacing:.06em}
.sync{display:flex;align-items:center;gap:8px;background:rgba(184,137,47,.14);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:600;margin:12px 0 14px}
.sync i{width:10px;height:10px;border-radius:50%;background:var(--ac);display:inline-block}
.erow{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(58,38,26,.06);user-select:none;-webkit-user-select:none}
.grip{font-size:22px;color:var(--mu);touch-action:none;cursor:grab;padding:8px 6px;line-height:1}
.em{flex:1;min-width:0}.en{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.ed2{font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.eb{border:0;background:none;color:var(--ink);font-weight:700;font-size:14px;padding:8px 4px;min-height:40px;cursor:pointer}
.erow.drag{box-shadow:0 16px 30px rgba(58,38,26,.38);position:relative;z-index:5;border-color:var(--ac);transition:none;will-change:transform}
.leaflet-popup-content-wrapper{border-radius:12px;background:var(--card2);color:var(--tx);box-shadow:0 6px 18px rgba(58,38,26,.25)}
.leaflet-popup-tip{background:var(--card2)}.leaflet-popup-content{margin:12px 14px}
.leaflet-container a.pbtn{display:block;margin-top:8px;text-align:center;background:var(--ink);color:var(--on)!important;border-radius:8px;padding:8px 12px;text-decoration:none;font-size:13px;letter-spacing:.06em}

/* ---- 統一風格:圓角卡片、同一組字體(英文數字 Jost / Cormorant,中文 Noto) ---- */
h3,.brand,.dt,.dnum,.tct,.et,#tname{font-feature-settings:'lnum' 1;font-variant-numeric:lining-nums}
h3{font-weight:600;font-size:18px}
#list .card,.cr{background:var(--card2);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:0 2px 10px rgba(58,38,26,.06)}
#list .card details:first-child{margin-top:0}
#sheet .card{background:none;border:0;box-shadow:none;padding:4px 0}
button.p{border-radius:12px}
.chip{border-radius:99px;background:var(--bg)}
.chip.on{background:var(--ink)}
.banner{border-radius:12px;background:var(--card2);border:1px solid var(--bd);border-left:3px solid var(--ac)}
.tlt,.ed2,.it b,.pill,.pin,.pn span{font-family:var(--sans)}
#nbox{border-radius:20px}.cr{margin:0;box-shadow:none;background:transparent;border:0;padding:0}
#sheet{border-radius:20px 20px 0 0}
.mu{font-weight:400}
/* 首頁 */
.hhero{position:relative;height:196px;border-radius:22px;overflow:hidden;margin:6px 0 16px;background:linear-gradient(180deg,#f7e4b0 0%,#f2cf86 55%,#e9b95f 100%);box-shadow:0 8px 22px rgba(138,90,43,.22)}
.hhero svg{position:absolute;inset:0;width:100%;height:100%}
.hhero .ht{position:absolute;left:20px;top:18px;color:#4a3426;z-index:3}
.hhero .ht b{display:block;font:600 26px/1.2 var(--serif);letter-spacing:.12em}
.hhero .ht span{font-size:12px;letter-spacing:.3em;opacity:.8}
.cld{animation:drift 38s linear infinite}.cld.b{animation-duration:55s;animation-delay:-20s}.cld.c{animation-duration:46s;animation-delay:-8s}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(460px)}}
.plane{animation:fly 14s ease-in-out infinite}
@keyframes fly{0%{transform:translate(-60px,70px) rotate(-8deg)}50%{transform:translate(200px,36px) rotate(-4deg)}100%{transform:translate(460px,6px) rotate(-10deg)}}
.pet{animation:fall 9s linear infinite;opacity:.9}.pet:nth-of-type(2n){animation-duration:12s;animation-delay:-4s}.pet:nth-of-type(3n){animation-duration:10s;animation-delay:-7s}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0)}100%{transform:translate(-50px,230px) rotate(300deg)}}
.sun{animation:glow 5s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes glow{50%{transform:scale(1.06);opacity:.9}}
.go{display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;letter-spacing:.2em;min-height:52px;background:linear-gradient(90deg,#8a5a2b,#b8892f)!important;border-color:transparent!important;box-shadow:0 6px 16px rgba(138,90,43,.28)}
.go svg{width:18px;height:18px;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
.tcard{position:relative;display:flex;gap:14px;align-items:stretch;background:var(--card2);border:1px solid var(--bd);border-radius:18px;padding:10px;margin-bottom:12px;box-shadow:0 2px 12px rgba(58,38,26,.07);text-decoration:none;color:var(--tx)}
.tcv{flex:0 0 92px;height:92px;border-radius:13px;overflow:hidden;position:relative}
.tcv svg{width:100%;height:100%;display:block}
.tcard>a{display:flex;gap:14px;flex:1;min-width:0;color:inherit;text-decoration:none}
.tcb{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding-right:34px}
.tcn{font:600 18px/1.35 var(--serif);letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcm{font-size:12.5px;color:var(--mu);margin-top:2px}
.tcm i{font-style:normal;display:inline-block;margin-right:10px}
.tcx{position:absolute;right:2px;top:2px}
.empty{text-align:center;padding:26px 10px;color:var(--mu);font-size:14px}
@media (prefers-reduced-motion:reduce){.cld,.plane,.pet,.sun,.go svg{animation:none}}
</style></head><body><main id="app"></main><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import * as CFG from './config.js';
const firebaseConfig=CFG.firebaseConfig,mapsKey=CFG.mapsKey||'';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,addDoc,collection,onSnapshot,getDocs,writeBatch} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

function openTrip(){
  shell();$('#hd').innerHTML=topbar()+'<p class=mu>載入中…</p>';
  unsubs.push(onSnapshot(tripRef(),s=>{
    if(!s.exists()){T=false;$('#hd').innerHTML=topbar()+'<div class=card>找不到這個旅程,或連結不正確。<br><a href="#/">回首頁</a></div>';return}
    const first=!T;T={id:route.tid,...s.data()};renderHeader();if(first){renderNav();renderForm()}renderList()},
    ()=>{T=false;$('#hd').innerHTML=topbar()+'<div class=card>無法讀取旅程。<br><a href="#/">回首頁</a></div>'}));
  unsubs.push(onSnapshot(itemsCol(),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));if(T)renderList()},()=>{}));

    unsubs.push(onSnapshot(doc(db,'trips',route.tid,'editors',user.uid),s=>{const was=isEd;isEd=s.exists();if(T){renderHeader();if(was!=isEd)renderForm();renderList()}},()=>{}));

async function tryJoin(){
  if(!route.join)return;
  try{
    const er=doc(db,'trips',route.tid,'editors',user.uid);
    const ex=await getDoc(er).catch(()=>null);
    if(!(ex&&ex.exists()))await setDoc(er,{role:'editor',name:user.displayName||user.email||'',token:route.join});
    toast('已加入為編輯者');
  }catch(e){toast('邀請碼無效或已被更換,目前只能預覽')}
  history.replaceState(null,'','#/t/'+route.tid);route.join=null;
}

const sortItin=a=>{const man=(T&&T.manual)||{},tc=(x,y)=>(x.time||'').localeCompare(y.time||'');return [...a].sort((x,y)=>x.day-y.day||(man[x.day]?((x.ord??1e12)-(y.ord??1e12)||tc(x,y)):tc(x,y)))};
function ordFor(day,time){const a=sortItin(itemsOf('itin')).filter(x=>x.day==day);if(!a.length)return 1000;let i=a.length;if(time)for(let k=0;k<a.length;k++)if(a[k].time&&a[k].time>time){i=k;break}
  const po=i>0?(a[i-1].ord??i*1000):0,no=i<a.length?(a[i].ord??po+2000):po+2000;return (po+no)/2}
function parseGMaps(u){u=String(u||'').trim();if(!/^https?:\/\//i.test(u))return null;
  const m=u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||u.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/);
  let name='';const p=u.match(/\/place\/([^\/@?]+)/);if(p){try{name=decodeURIComponent(p[1].replace(/\+/g,' '))}catch(e){name=p[1]}}
  return {url:u,lat:m?+m[1]:null,lon:m?+m[2]:null,name,short:/(maps\.app\.goo\.gl|goo\.gl\/maps)/i.test(u)}}
function applyGL(v){const g=parseGMaps(v);if(!g){if(String(v).trim())toast('請貼上以 https 開頭的連結');return}
  if(g.lat!=null){selPlace={name:g.name||(selPlace&&selPlace.name)||'',lat:g.lat,lon:g.lon};if(!$('#ti').value.trim()&&g.name)$('#ti').value=g.name;showSel();toast('已帶入地標與位置')}
  else toast(g.short?'短連結已保留,但無法自動取得位置,請確認名稱並用搜尋選擇位置':'連結已保留,但沒有讀到座標')}
function editView(){

async function saveOrder(ids){const day=editDay;await guard(async()=>{const b=writeBatch(db);ids.forEach((id,i)=>b.update(doc(db,'trips',T.id,'items',id),{ord:(i+1)*1000}));b.update(tripRef(),{['manual.'+day]:true});await b.commit()})}
const WD=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const TAGC={景點:['#7a5410','rgba(184,137,47,.22)'],餐廳:['#9a4a2a','rgba(200,110,70,.18)'],交通:['#5a4a3a','rgba(110,90,70,.18)'],住宿:['#5d5a2f','rgba(120,115,60,.2)'],購物:['#8a4a55','rgba(150,80,90,.16)'],其他:['#7a6f62','rgba(125,115,100,.2)']};
const dayDate=d=>{if(!T.startDate)return null;const t=new Date(T.startDate+'T00:00:00');if(isNaN(t))return null;t.setDate(t.getDate()+d-1);return t};
const md=t=>t?`${t.getMonth()+1}/${t.getDate()}`:'';
const km=(a,b)=>{const r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r,h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const dayCount=()=>Math.max((T&&+T.dayCount)||0,...itemsOf('itin').map(x=>+x.day||0),0);
const dayList=()=>Array.from({length:dayCount()},(_,i)=>i+1);
function renderHeroMeta(){

  e.textContent=p.join(' · ');r.textContent=(T.region||'').toUpperCase();

function navUrl(day){
  const a=sortItin(itemsOf('itin')).filter(x=>x.day==day&&x.lat!=null);if(a.length<2)return '';
  const p=x=>x.lat+','+x.lon,wp=a.slice(1,-1).slice(0,8).map(p).join('|');
  return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(p(a[0]))+'&destination='+encodeURIComponent(p(a[a.length-1]))+(wp?'&waypoints='+encodeURIComponent(wp):'')+'&travelmode=transit';
}
function timeline(g){

  let prev=null;
  return `<div class=tl>`+g.map(x=>{
    const has=x.lat!=null,d=has&&prev?km(prev,x):null;if(has)prev=x;
    const tg=x.tag&&TAGC[x.tag]?`<span class=tag style="color:${TAGC[x.tag][0]};background:${TAGC[x.tag][1]}">${esc(x.tag)}</span>`:'';

/* ---------- 地點搜尋(Google Places 或 OpenStreetMap Nominatim) ---------- */
async function geocode(q,limit=5){
  if(G&&!gFail){try{
    await loadG();const {Place}=await google.maps.importLibrary('places');
    const {places}=await Place.searchByText({textQuery:q,fields:['displayName','formattedAddress','location'],maxResultCount:Math.max(1,Math.min(limit,20)),language:'zh-TW'});
    return (places||[]).map(p=>({name:tw(p.displayName||''),full:tw([p.displayName,p.formattedAddress].filter(Boolean).join(' · ')),lat:p.location.lat(),lon:p.location.lng()}));
  }catch(e){gFail=true;toast('Google 搜尋無法使用,已改用 OpenStreetMap 搜尋')}}
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit='+limit+'&accept-language='+encodeURIComponent('zh-Hant,zh-TW,zh-HK,zh,ja,en')+'&q='+encodeURIComponent(q));
  if(!r.ok)throw new Error('geo');
  return (await r.json()).map(p=>({name:tw(segsOf(p.display_name)[0]||p.display_name),full:tw(p.display_name),lat:+p.lat,lon:+p.lon}));
}

      window.__res=r;box.innerHTML='<div class=res>'+r.map((p,i)=>`<div data-a=pickPlace data-i=${i}>${esc(p.full)}</div>`).join('')+'</div>'}
    catch(e){box.innerHTML='<div class=mu>搜尋失敗'+''+',請稍後再試</div>'}},
  pickPlace(e){const p=(window.__res||[])[+e.dataset.i];if(!p)return;selPlace={name:p.name,lat:p.lat,lon:p.lon};$('#resbox').innerHTML='';if(!$('#ti').value.trim())$('#ti').value=selPlace.name;showSel()},
  saveItin(){const ti=$('#ti').value.trim();if(!ti)return toast('請輸入行程名稱');
    const data={day:Math.min(60,Math.max(1,Math.round(+$('#d').value)||1)),time:$('#t').value,title:ti.slice(0,80),note:$('#no').value.trim().slice(0,120),tag:$('#tg').value};
    {const gv=$('#gl').value.trim(),g=parseGMaps(gv);if(g){data.url=g.url.slice(0,500);if(g.lat!=null&&!selPlace)selPlace={name:g.name,lat:g.lat,lon:g.lon}}else if(!gv)data.url=''}
    {const xa=$('#xa');if(xa){const amt=+xa.value;if(amt>0){const who=[...document.querySelectorAll('.xw:checked')].map(v=>v.value);if(!who.length)return toast('請選擇分攤者');data.amt=amt;data.cur=$('#xu').value;data.payer=$('#xp').value;data.who=who;data.cat=$('#xc').value}else if(editId){data.amt=0;data.cur='';data.payer='';data.who=[];data.cat=''}}}
    if(!editId&&T.manual&&T.manual[data.day])data.ord=ordFor(data.day,data.time);
    if(selPlace){data.lat=selPlace.lat;data.lon=selPlace.lon;data.placeName=selPlace.name}
    guard(async()=>{if(editId){await updateDoc(doc(db,'trips',T.id,'items',editId),data);editId=null}else await addItem('itin',data);selPlace=null;needFit=true;closeSheet();renderForm()})},
  importSheet(){importRows($('#sp').value);$('#sp').value=''},
  async autoLocate(){if(!isEd)return;const todo=sortItin(itemsOf('itin')).filter(x=>x.lat==null);if(!todo.length)return toast('沒有需要定位的行程');
    toast(`開始定位 ${todo.length} 項,約需 ${Math.ceil(todo.length*(G?.4:1.1))} 秒`);let ok=0;
    for(const x of todo){try{const r=await geocode((segsOf(x.title)[0]||x.title)+' '+(T.region||''),1);if(r[0]){await updateDoc(doc(db,'trips',T.id,'items',x.id),{lat:r[0].lat,lon:r[0].lon,placeName:r[0].name||''});ok++}}catch(e){}await sleep(G&&!gFail?250:1100)}
    needFit=true;toast(`已定位 ${ok} / ${todo.length} 項,其餘請手動選位置`)},
  addDay(){if(!isEd)return;const n=dayCount()+1;if(n>60)return toast('最多 60 天');dayF=n;needFit=true;guard(()=>updateDoc(tripRef(),{dayCount:n}))},
  delDay(){const d=editDay,N=dayCount(),its=itemsOf('itin'),mine=its.filter(x=>x.day==d);
    if(N<=1)return toast('至少要保留一天');
    if(!confirm(mine.length?`確定刪除 Day ${d}?這天的 ${mine.length} 筆行程會一併刪除,後面的天數會往前補。`:`確定刪除 Day ${d}?後面的天數會往前補。`))return;
    const shift=o=>{const r={};Object.keys(o||{}).forEach(k=>{const n=+k;if(n<d)r[n]=o[k];else if(n>d)r[n-1]=o[k]});return r};
    guard(async()=>{const b=writeBatch(db);
      its.forEach(x=>{if(x.day==d)b.delete(doc(db,'trips',T.id,'items',x.id));else if(x.day>d)b.update(doc(db,'trips',T.id,'items',x.id),{day:x.day-1})});
      b.update(tripRef(),{dayCount:N-1,dayTitles:shift(T.dayTitles),manual:shift(T.manual)});
      await b.commit();editDay=0;document.body.classList.remove('editing');dayF=Math.min(d,N-1);needFit=true;renderList();window.scrollTo(0,0);toast('已刪除 Day '+d)})},
  editLinked(e){tab=0;editId=e.dataset.id;selPlace=null;renderNav();renderList();openSheet()},
  enterEdit(){if(!isEd||!dayF)return;editDay=dayF;document.body.classList.add('editing');renderList();window.scrollTo(0,0)},
  exitEdit(){editDay=0;document.body.classList.remove('editing');needFit=true;renderList();setTimeout(()=>{if(map){if(G)google.maps.event.trigger(map,'resize');else map.invalidateSize()}},60);window.scrollTo(0,0)},
  resortTime(){guard(()=>updateDoc(tripRef(),{['manual.'+editDay]:false}).then(()=>toast('已依時間重新排序')))},
  dayTitle(){const cur=(T.dayTitles||{})[dayF]||'';const v=prompt('這一天的標題(例如:淺草・晴空塔)',cur);if(v===null)return;guard(()=>updateDoc(tripRef(),{['dayTitles.'+dayF]:v.trim().slice(0,40)}))},
  addMem(){const v=$('#mn').value.trim();if(!v||(T.members||[]).includes(v))return;guard(()=>updateDoc(tripRef(),{members:[...(T.members||[]),v]}).then(()=>{renderForm();renderList()}))},
  delMem(e){guard(()=>updateDoc(tripRef(),{members:(T.members||[]).filter(m=>m!=e.dataset.n)}).then(()=>{renderForm();renderList()}))},
  addExp(){const d=$('#ed').value.trim(),a=+$('#ea').value,w=[...document.querySelectorAll('.ew:checked')].map(x=>x.value);if(!d||!a||!w.length)return toast('請填項目、金額與分攤者');
    guard(async()=>{await addItem('exp',{desc:d.slice(0,80),amt:a,cur:$('#ec').value,payer:$('#ep').value,who:w,cat:$('#ecat').value});$('#ed').value=$('#ea').value='';closeSheet()})},
  addRate(){const c=$('#nc').value.trim().toUpperCase().slice(0,6),r=+$('#nr').value;if(!c||!r)return;guard(()=>updateDoc(tripRef(),{['rates.'+c]:r}).then(renderForm))},
  addMemo(){const v=$('#mt').value.trim();if(!v)return;guard(async()=>{await addItem('memo',{text:v.slice(0,2000)});$('#mt').value='';closeSheet()})},
  addChk(e){const k=e.dataset.k,v=$('#ci').value.trim();if(!v)return;const o={title:v.slice(0,80),done:false};if(k=='tix'&&$('#cd').value)o.date=$('#cd').value;guard(async()=>{await addItem(k,o);$('#ci').value='';closeSheet()})},
  preset(){guard(async()=>{const have=itemsOf('pack').map(x=>x.title);for(const t of PACK)if(!have.includes(t))await addItem('pack',{title:t,done:false});closeSheet()})},
  del(e){if(!confirm('確定刪除?'))return;guard(()=>deleteDoc(doc(db,'trips',T.id,'items',e.dataset.id)))}
};
let sx=0,sy=0,sOK=false;
document.addEventListener('touchstart',e=>{sOK=!!(e.target.closest&&e.target.closest('#list'))&&tab==0&&!editDay&&!dragging&&e.touches.length==1;if(sOK){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
document.addEventListener('touchend',e=>{if(!sOK)return;sOK=false;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<60||Math.abs(dy)>45||Math.abs(dx)<Math.abs(dy)*1.8)return;
  const ds=dayList();if(!ds.length)return;const arr=[0,...ds];let i=arr.indexOf(dayF);if(i<0)i=0;i+=dx<0?1:-1;if(i<0||i>=arr.length)return;
  dayF=arr[i];needFit=true;renderList()},{passive:true});
let suppressClick=0;
function dragSort(e,el,box,sel,ax,onDone){
  const y=ax=='y',off=()=>y?window.scrollY:box.scrollLeft,pc=ev=>(y?ev.clientY:ev.clientX)+off(),
        ps=n=>n.getBoundingClientRect()[y?'top':'left']+off(),sz=n=>y?n.offsetHeight:n.offsetWidth;
  const p0=pc(e),s0=ps(el);dragging=true;el.classList.add('drag');
  try{box.setPointerCapture(e.pointerId)}catch(x){}
  const move=ev=>{
    if(y){if(ev.clientY<90)window.scrollBy(0,-14);else if(ev.clientY>innerHeight-90)window.scrollBy(0,14)}
    else{const r=box.getBoundingClientRect();if(ev.clientX<r.left+40)box.scrollLeft-=12;else if(ev.clientX>r.right-40)box.scrollLeft+=12}
    el.style.transform='none';
    const want=s0+(pc(ev)-p0),c=want+sz(el)/2,sibs=[...box.querySelectorAll(sel)].filter(r=>r!==el);let placed=false;
    for(const r of sibs){if(c<ps(r)+sz(r)/2){box.insertBefore(el,r);placed=true;break}}
    if(!placed&&sibs.length)sibs[sibs.length-1].after(el);
    el.style.transform=`translate${y?'Y':'X'}(${want-ps(el)}px) scale(1.04)`};
  const end=()=>{box.removeEventListener('pointermove',move);box.removeEventListener('pointerup',end);box.removeEventListener('pointercancel',end);
    el.style.transform='';el.classList.remove('drag');dragging=false;suppressClick=Date.now()+350;
    onDone([...box.querySelectorAll(sel)].map(r=>r.dataset.id||r.dataset.d))};
  box.addEventListener('pointermove',move);box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
}
async function saveDayOrder(arr){
  const order=arr.map(Number);if(order.every((d,i)=>d===i+1)){renderList();return}
  const pos={};order.forEach((d,i)=>pos[d]=i+1);
  const remap=o=>{const r={};Object.keys(o||{}).forEach(k=>{if(pos[+k])r[pos[+k]]=o[k]});return r};
  await guard(async()=>{const b=writeBatch(db);
    itemsOf('itin').forEach(x=>{const nd=pos[x.day];if(nd&&nd!==x.day)b.update(doc(db,'trips',T.id,'items',x.id),{day:nd})});
    b.update(tripRef(),{dayTitles:remap(T.dayTitles),manual:remap(T.manual)});await b.commit();
    if(dayF&&pos[dayF])dayF=pos[dayF];needFit=true});
  renderList()}
let ldT=0,ldE=null,ldXY=null;
document.addEventListener('pointerdown',e=>{
  const tg=e.target;if(!tg||!tg.closest||dragging)return;
  const g=tg.closest('.grip');
  if(g&&isEd){const row=g.closest('.erow'),box=$('#erows');if(row&&box){e.preventDefault();dragSort(e,row,box,'.erow','y',ids=>saveOrder(ids).then(()=>renderList()))}return}
  const p=tg.closest('.pill[data-d]');
  if(p&&isEd&&p.dataset.d!=='0'){ldE=e;ldXY=[e.clientX,e.clientY];clearTimeout(ldT);
    ldT=setTimeout(()=>{ldT=0;const box=$('#dayf');if(box&&p.isConnected){dragSort(ldE,p,box,'.pill[data-d]:not([data-d="0"])','x',saveDayOrder);if(navigator.vibrate)navigator.vibrate(12)}},380)}
});
document.addEventListener('pointermove',e=>{if(ldT&&ldXY&&Math.hypot(e.clientX-ldXY[0],e.clientY-ldXY[1])>8){clearTimeout(ldT);ldT=0}});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{if(ldT){clearTimeout(ldT);ldT=0}}));
document.addEventListener('touchmove',e=>{if(dragging&&e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.pill,.grip'))e.preventDefault()});
document.addEventListener('click',e=>{if(Date.now()<suppressClick)return;const t=e.target.closest('[data-tab],[data-a]');if(!t)return;
  if(t.dataset.tab!==undefined){tab=+t.dataset.tab;editId=null;selPlace=null;closeSheet();renderNav();renderForm();renderList();window.scrollTo(0,0)}
  else if(A[t.dataset.a]){if(t.tagName=='A'&&t.getAttribute('href')=='#')e.preventDefault();A[t.dataset.a](t)}});
document.addEventListener('change',e=>{const t=e.target;if(!T||!route.tid)return;
  if(t.id=='tname'){guard(()=>updateDoc(tripRef(),{name:t.value.trim()||'未命名'}))}
  else if(t.id=='daytitle'){guard(()=>updateDoc(tripRef(),{['dayTitles.'+editDay]:t.value.trim().slice(0,40)}))}
  else if(t.id=='gl'){applyGL(t.value)}
  else if(t.id=='tg'){const c=TAG2CAT[t.value],xc=$('#xc'),xa=$('#xa');if(c&&xc&&!(xa&&+xa.value>0))xc.value=c}
  else if(t.id=='startd'){const N=dayCount(),old=T.startDate;let up={startDate:t.value||''};const e=$('#endd');if(t.value&&e&&e.value){const n=Math.round((new Date(e.value+'T00:00:00')-new Date(t.value+'T00:00:00'))/864e5)+1;if(n>=1&&n<=60)up.dayCount=n}guard(()=>updateDoc(tripRef(),up).then(renderShare))}
  else if(t.id=='endd'){if(!T.startDate){toast('請先設定出發日');t.value='';return}const n=Math.round((new Date(t.value+'T00:00:00')-new Date(T.startDate+'T00:00:00'))/864e5)+1;if(!(n>=1))return toast('回程日不能早於出發日');if(n>60)return toast('最多 60 天');
    const mx=Math.max(0,...itemsOf('itin').map(x=>+x.day||0));if(n<mx)return toast('第 '+mx+' 天還有行程,請先到編輯頁移除或移動');guard(()=>updateDoc(tripRef(),{dayCount:n}).then(renderShare))}
  else if(t.id=='base'){guard(()=>updateDoc(tripRef(),{base:t.value}).then(()=>{renderForm();renderList()}))}
  else if(t.dataset.r){guard(()=>updateDoc(tripRef(),{['rates.'+t.dataset.r]:+t.value||1}))}
  else if(t.id=='region'){A.region(t)}
  else if(t.id=='csvf'){const f=t.files[0];if(f)f.text().then(importRows);t.value=''}
  else if(t.type=='checkbox'&&t.dataset.id){guard(()=>updateDoc(doc(db,'trips',T.id,'items',t.dataset.id),{done:t.checked}))}});
</script></body></html>
